<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Bus Body Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Bus Chassis -->
    <rect x="106" y="120" width="300" height="250" rx="36" fill="url(#busGrad)"/>
    
    <!-- Top Destination Screen -->
    <rect x="156" y="142" width="200" height="34" rx="8" fill="#0f172a"/>
    <text x="256" y="165" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">LINUS USU</text>

    <!-- Windshield -->
    <rect x="136" y="190" width="240" height="95" rx="14" fill="#0284c7"/>
    <path d="M 140 196 L 200 196 L 160 280 L 140 280 Z" fill="rgba(255,255,255,0.25)"/>

    <!-- Headlights -->
    <circle cx="156" cy="325" r="16" fill="#facc15"/>
    <circle cx="356" cy="325" r="16" fill="#facc15"/>

    <!-- Grille & Logo -->
    <rect x="206" y="315" width="100" height="20" rx="6" fill="#334155"/>
    <circle cx="256" cy="325" r="7" fill="#10b981"/>

    <!-- Wheels -->
    <rect x="126" y="360" width="56" height="32" rx="10" fill="#0f172a"/>
    <rect x="330" y="360" width="56" height="32" rx="10" fill="#0f172a"/>
  </g>

  <!-- Green Campus Leaf Badge -->
  <g transform="translate(360, 80) scale(1.1)">
    <circle cx="0" cy="0" r="32" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <path d="M -8 10 C -12 -6, 4 -16, 12 -12 C 16 -4, 6 12, -8 10 Z" fill="#ffffff"/>
  </g>
</svg>
